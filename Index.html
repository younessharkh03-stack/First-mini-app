<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجري المصغر</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
    }
    button {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h2 id="welcome">أهلاً بك!</h2>
  <p>هذا تطبيق تيليجرام مصغر جاهز للعمل.</p>

  <div class="card">
    <h3>شراء منتج تجريبي</h3>
    <p>السعر: 10 نجوم ⭐️</p>
    <button id="buyBtn">شراء الآن ⭐️</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // توسيع الشاشة لتأخذ الحجم الكامل

    // قراءة اسم المستخدم من تيليجرام
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('welcome').innerText = `أهلاً بك، ${user.first_name}! 👋`;
    }

    // عند الضغط على زر الشراء
    document.getElementById('buyBtn').addEventListener('click', async () => {
      tg.showAlert("جاهز لربط السيرفر وتفعيل الفاتورة الحقيقية!");
    });
  </script>
</body>
</html>
